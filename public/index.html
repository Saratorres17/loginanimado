<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login de Animales</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-gray-100">

  <div class="relative h-screen">
    
    <div class="absolute inset-0 bg-cover bg-center z-0" style="background-image: url('https://i.blogs.es/fb0cad/jamie-turner-otiamphp26a-unsplash-1-/1366_2000.jpg'); filter: blur(5px);"></div>

    <div class="flex justify-center items-center h-full z-10">
      
      <div class="bg-white bg-opacity-80 p-8 rounded-lg shadow-lg w-96 backdrop-blur-md">
        <h2 class="text-2xl font-bold text-center mb-4">Login de Animales</h2>
        <form id="loginForm">
          <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700">Nombre de usuario</label>
            <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <p id="errorMessage" class="text-red-500 text-sm text-center mb-4 hidden">Credenciales incorrectas</p>
          <button type="submit" class="w-full py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300 ease-in-out transform hover:scale-105">Iniciar sesión</button>
        </form>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
